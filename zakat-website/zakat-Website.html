<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة زكاة المال</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            color: #222;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 95%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #16855b;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #106b49;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>حاسبة زكاة المال</h1>

        <p>أدخل المبلغ الذي تريد حساب زكاته:</p>

        <input
            type="number"
            id="money"
            placeholder="مثال: 100000"
        >

        <button onclick="calculateZakat()">
            احسب الزكاة
        </button>

        <div id="result"></div>

    </div>

    <script>
        function calculateZakat() {

            let money = Number(document.getElementById("money").value);

            if (money <= 0) {
                document.getElementById("result").innerHTML =
                    "من فضلك أدخل مبلغ صحيح";
                return;
            }

            let zakat = money * 0.025;

            document.getElementById("result").innerHTML =
                "قيمة الزكاة: " + zakat.toLocaleString() + " جنيه";
        }
    </script>

</body>
</html>
